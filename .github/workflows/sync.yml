name: Cloud 24/7 Sync (Google Sheets to PostgreSQL)

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches:
      - main

jobs:
  sync:
    name: Sync Google Sheets to Neon DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://neondb_owner:npg_3TJdN6oyzPUx@ep-icy-sunset-aygvxck5-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require' }}
      SPREADSHEET_ID: '1vRYsfBey2qTmLf9iCkxSU4tb85e6nhYZzwaQ7DrMkII'
      IZLISHKA_GID: '2059071830'
      SGT_GID: '1647276156'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Sync
        run: |
          python -c "from auto_sync_all import do_full_sync; do_full_sync()"
